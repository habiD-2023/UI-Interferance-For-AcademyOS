<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademyOS | Add student</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../index.html" aria-label="Home">
        <img src="../assets/logo.jpg" alt="" />
      </a>

      <div class="academy-title" data-academy-name>Riazul Jannah Model School</div>

      <div class="topbar-actions">
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme"><svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
        <div class="user-menu">
          <button class="avatar-button" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Open user menu">
            <span data-user-initials>AD</span>
          </button>
          <div class="user-dropdown" hidden>
            <div class="user-dropdown-info">
              <strong data-user-name>Administrator</strong>
              <small data-user-role>Administrator</small>
            </div>
            <a class="user-dropdown-item" href="settings.html">Settings</a>
            <button class="user-dropdown-logout" type="button" data-logout>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="app-layout">
      <nav class="sidebar" aria-label="Main navigation">
        <a class="nav-link" href="../index.html">Dashboard</a>
        <a class="nav-link active" href="students.html">Students</a>
        <a class="nav-link" href="attendance.html">Attendance</a>
        <a class="nav-link" href="fees.html">Fees</a>
        <a class="nav-link" href="academics.html">Academics</a>
        <a class="nav-link" href="staff.html">Staff</a>
        <a class="nav-link" href="reports.html">Reports</a>
        <a class="nav-link" href="settings.html">Settings</a>
      </nav>

      <main class="main-content">
        <section class="page-heading">
          <p class="eyebrow">STUDENT MANAGEMENT</p>
          <h1>Add student</h1>
          <p>Enter the student and guardian details below.</p>
        </section>

        <form class="student-form">
          <section class="form-section">
            <h2>Student information</h2>

            <div class="form-grid">
              <div class="form-field">
                <label for="student-name">Student full name</label>
                <input
                  id="student-name"
                  name="studentName"
                  type="text"
                  placeholder="e.g. Ayesha Khan"
                  required
                />
              </div>

              <div class="form-field">
                <label for="admission-number">Admission number</label>
                <input
                  id="admission-number"
                  name="admissionNumber"
                  type="text"
                  placeholder="e.g. STU-2026-001"
                  required
                />
              </div>

              <div class="form-field">
                <label for="date-of-birth">Date of birth</label>
                <input
                  id="date-of-birth"
                  name="dateOfBirth"
                  type="date"
                  required
                />
              </div>

              <div class="form-field">
                <label for="class">Class</label>
                <select id="class" name="class" required>
                  <option value="">Select a class</option>
                  <option value="grade-6">Grade 6</option>
                  <option value="grade-7">Grade 7</option>
                  <option value="grade-8">Grade 8</option>
                  <option value="grade-9">Grade 9</option>
                  <option value="grade-10">Grade 10</option>
                </select>
              </div>

              <div class="form-field">
                <label for="section">Section</label>
                <select id="section" name="section" required>
                  <option value="">Select a section</option>
                  <option value="a">A</option>
                  <option value="b">B</option>
                </select>
              </div>

              <div class="form-field">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                  <option value="">Select gender</option>
                  <option value="female">Female</option>
                  <option value="male">Male</option>
                </select>
              </div>

            </div>
          </section>

          <section class="form-section">
            <h2>Guardian information</h2>

            <div class="form-grid">
              <div class="form-field">
                <label for="guardian-name">Guardian full name</label>
                <input
                  id="guardian-name"
                  name="guardianName"
                  type="text"
                  placeholder="e.g. Ahmed Khan"
                  required
                />
              </div>

              <div class="form-field">
                <label for="guardian-phone">Guardian phone number</label>
                <input
                  id="guardian-phone"
                  name="guardianPhone"
                  type="tel"
                  placeholder="e.g. 03XX-XXXXXXX"
                  required
                />
              </div>
            </div>
          </section>

          <div class="form-actions">
            <a class="cancel-button" href="students.html">Cancel</a>
            <button class="add-button" type="submit">Save student</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
