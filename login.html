<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademyOS | Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <script src="script.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="brand" href="login.html">
        <img src="assets/logo.jpg" alt="Riazul Jannah Model School" />
        <span class="brand-text">Riazul Jannah Model School</span>
      </a>
      <p>Log in to manage your academy.</p>

      <form id="login-form">
        <p class="form-error" role="alert"></p>

        <div class="form-field">
          <label for="role">Log in as</label>
          <select id="role" name="role">
            <option value="admin">Administrator</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>

        <div class="form-field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="login-actions">
          <button class="add-button" type="submit">Login</button>
          <a class="cancel-button" href="signup.html">Sign up</a>
        </div>
      </form>

      <p class="login-note">
        Forgot your password? Contact your administrator.
      </p>
    </main>
  </body>
</html>
