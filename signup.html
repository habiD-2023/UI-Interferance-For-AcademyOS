<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcademyOS | Sign up</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <script src="script.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="brand" href="login.html">
        <img src="assets/logo.jpg" alt="Riazul Jannah Model School" />
        <span class="brand-text">Riazul Jannah Model School</span>
      </a>
      <p>Create your account to get started.</p>

      <form id="signup-form">
        <p class="form-error" role="alert"></p>

        <div class="form-field">
          <label for="signup-name">Full name</label>
          <input
            id="signup-name"
            name="name"
            type="text"
            placeholder="e.g. Imran Khan"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-field">
          <label for="signup-role">Sign up as</label>
          <select id="signup-role" name="role">
            <option value="admin">Administrator</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>

        <div class="form-field">
          <label for="signup-email">Email address</label>
          <input
            id="signup-email"
            name="email"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-field">
          <label for="signup-phone">Phone number (optional)</label>
          <input
            id="signup-phone"
            name="phone"
            type="tel"
            placeholder="03XX-XXXXXXX"
            autocomplete="tel"
          />
        </div>

        <div class="form-field">
          <label for="signup-password">Password</label>
          <input
            id="signup-password"
            name="password"
            type="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-field">
          <label for="signup-confirm">Confirm password</label>
          <input
            id="signup-confirm"
            name="confirm"
            type="password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="login-actions">
          <button class="add-button" type="submit">Create account</button>
          <a class="cancel-button" href="login.html">Back to login</a>
        </div>
      </form>

      <p class="login-note">Already have an account? Use Back to login.</p>
    </main>
  </body>
</html>
